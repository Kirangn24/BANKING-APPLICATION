<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forgot Pin</title>
    <style>
        body {
			background-size: 100%;
			background-image: url(https://qph.cf2.quoracdn.net/main-qimg-755e9878f669ffae63f61c5836ed376c-lq);
            font-family: Arial, sans-serif;
            background-color: #f4f4f4;
            margin: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh;
        }

        form {
            background-color: #fff;
            max-width: 400px;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
        }

        .h1 {
            text-align: center;
            color: #333;
        }

        .d1 {
            text-align: center;
        }

        .i1 {
            width: 100%;
            padding: 10px;
            margin-bottom: 15px;
            box-sizing: border-box;
            border: 1px solid #ccc;
            border-radius: 4px;
            font-size: 16px;
        }

        .s1 {
            width: 100%;
            padding: 12px;
            background-color: #4CAF50;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 16px;
        }
    </style>
</head>
<body class="f1">
    <form action="forget" method="post">
        <h1 class="h1">Welcome to Password Recovery</h1>
        <div class="d1">
            <h1 class="head">Get Password</h1>
            <input type="text" placeholder="Enter Acc number" name="AN" class="i1" required><br>
            <input type="text" placeholder="Enter Acc holder name" name="AHN" class="i1" required><br>
            <input type="submit" value="Confirm" class="s1"><br>
        </div>
    </form>
</body>
</html>
